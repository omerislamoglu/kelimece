<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- Viewport & Mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kelimece" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Theme Color (light & dark) -->
    <meta name="theme-color" content="#0d9488" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0a09" media="(prefers-color-scheme: dark)" />

    <!-- SEO -->
    <title>Kelimece — Türkçe Kelime Bulmacası</title>
    <meta name="description" content="Kelimece ile her gün yeni bir Türkçe kelime bulmacası çöz. 7 harften hedef kelimeleri, tam kelimeleri ve bonus kelimeleri bul." />
    <meta name="keywords" content="kelimece, kelime bulmacası, türkçe oyun, kelime oyunu, günlük bulmaca" />
    <meta name="author" content="Kelimece" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kelimece — Türkçe Kelime Bulmacası" />
    <meta property="og:description" content="Her gün yeni bir Türkçe kelime bulmacası. 7 harften mümkün olduğunca çok kelime bul." />
    <meta property="og:image" content="/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://kelimece.app" />
    <meta property="og:site_name" content="Kelimece" />
    <meta property="og:locale" content="tr_TR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kelimece — Türkçe Kelime Bulmacası" />
    <meta name="twitter:description" content="Her gün yeni bir Türkçe kelime bulmacası. 7 harften mümkün olduğunca çok kelime bul." />
    <meta name="twitter:image" content="/og-image.svg" />

  </head>
  <body>
    <script>
      // Prevent flash of wrong theme on initial load
      (function(){var t=localStorage.getItem('kelimece-theme');var d=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.classList.toggle('dark',d);document.body.style.backgroundColor=d?'#020617':'#f8fafc'})()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
